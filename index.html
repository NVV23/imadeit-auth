<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>I Made It Login</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #ffffff; color: #000000; }
        .container { text-align: center; width: 100%; padding: 20px; }
        .spinner { border: 3px solid rgba(0,0,0,0.1); border-top: 3px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { font-size: 16px; font-weight: 500; color: #2c3e50; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div id="status" class="status-text">Logging in to I Made It...</div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;

        async function startLogin() {
            try {
                tg.ready();
                tg.expand();
                const initData = tg.initData;

                if (!initData) {
                    document.getElementById('status').innerText = 'Error: Open this inside Telegram';
                    return;
                }

                // Replace this URL with your Supabase Edge Function URL
                const FUNCTION_URL = 'https://hvizmqxxkwyyqlixbzui.supabase.co/functions/v1/telegram-bot';

                const response = await fetch(FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData })
                });

                if (response.ok) {
                    document.getElementById('status').innerText = '✅ Success! Returning to app...';
                    setTimeout(() => tg.close(), 1000);
                } else {
                    const err = await response.text();
                    document.getElementById('status').innerText = '❌ Login failed: ' + err;
                }
            } catch (e) {
                document.getElementById('status').innerText = '❌ Network error';
            }
        }

        window.onload = startLogin;
    </script>
</body>
</html>
