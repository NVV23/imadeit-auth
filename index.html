<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>I Made It Login</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #ffffff; color: #000000; overflow: hidden; }
        .container { text-align: center; width: 100%; padding: 40px; transition: all 0.3s ease; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { font-size: 18px; font-weight: 600; color: #2c3e50; }

        /* Success State */
        .success-icon { font-size: 80px; color: #2ecc71; margin-bottom: 20px; display: none; transform: scale(0.5); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .success-title { font-size: 24px; font-weight: 800; color: #2ecc71; display: none; margin-bottom: 10px; }

        .success .spinner { display: none; }
        .success .success-icon, .success .success-title { display: block; transform: scale(1); }
        .success .status-text { color: #7f8c8d; font-weight: 400; }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="spinner" id="spinner"></div>
        <div class="success-icon" id="successIcon">✅</div>
        <div class="success-title" id="successTitle">I Made It</div>
        <div id="status" class="status-text">Authenticating...</div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;

        async function startLogin() {
            try {
                tg.ready();
                tg.expand();
                const initData = tg.initData;

                if (!initData) {
                    document.getElementById('status').innerText = 'Error: Please open in Telegram';
                    return;
                }

                const response = await fetch('https://hvizmqxxkwyyqlixbzui.supabase.co/functions/v1/telegram-bot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData })
                });

                if (response.ok) {
                    // Visual Success Transition
                    document.getElementById('mainContainer').classList.add('success');
                    document.getElementById('status').innerText = 'You are successfully logged in. You can now return to the app.';

                    // Vibrate the phone (Haptic Feedback)
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }

                    // Auto-close after 3 seconds so they can read the message
                    setTimeout(() => {
                        tg.close();
                    }, 3000);
                } else {
                    document.getElementById('status').innerText = '❌ Login failed. Please try again.';
                }
            } catch (e) {
                document.getElementById('status').innerText = '❌ Network error';
            }
        }

        window.onload = startLogin;
    </script>
</body>
</html>
